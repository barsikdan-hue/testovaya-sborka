<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#FCDCCE">
  <meta name="description" content="Личное приглашение на свидание.">
  <title>Для тебя ❤️</title>
  <link rel="stylesheet" href="./styles.css?v=android-visibility-1">
</head>
<body>
  <main class="phone-canvas" aria-label="Личное приглашение">
    <section class="screen invitation-screen is-active" data-screen="invitation" tabindex="-1">
      <img
        id="invitation-reference"
        class="reference-screen-image invitation-reference"
        src="./assets/invitation-reference.webp"
        width="430" height="1241"
        alt="Приглашение на свидание на фоне тёплой террасы на закате"
      >

      <button id="yes-button" class="reference-hotspot yes-hotspot" type="button">
        <span class="sr-only">Да, я согласна на свидание</span>
      </button>
      <button id="later-button" class="reference-hotspot later-hotspot" type="button">
        <span class="sr-only">Давай выберем другой день</span>
      </button>
    </section>

    <section class="screen success-screen" data-screen="success" tabindex="-1" hidden>
      <img
        id="success-reference"
        class="reference-screen-image success-reference"
        src="./assets/success-reference.webp"
        width="430" height="1040"
        alt="Романтический конверт с сердцем и цветами"
      >

      <p class="success-subtitle-overlay">Посмотрим, что ты придумал 😌</p>

      <div class="success-message-overlay" aria-label="Сообщение для Данила">
        <span class="overlay-heart" aria-hidden="true">♡</span>
        <p id="response-preview">Да ❤️ Я согласна. Посмотрим, что ты придумал 😌</p>
      </div>

      <button id="send-response" class="reference-hotspot send-hotspot" type="button">
        <span class="sr-only">Отправить Данилу в Telegram</span>
      </button>
      <p id="share-status" class="sr-only" aria-live="polite"></p>
    </section>
  </main>

  <noscript><div class="noscript">Для приглашения нужен JavaScript.</div></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
