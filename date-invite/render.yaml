services:
  - type: web
    runtime: static
    name: date-invite-danil
    branch: date-invite
    buildCommand: echo "Static site ready"
    staticPublishPath: ./date-invite/public
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
